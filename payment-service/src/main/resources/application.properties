server.port=8083

spring.application.name=payment-service

# Expose actuator health/info for container healthcheck
management.endpoints.web.exposure.include=health,info

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres-payment:5432/paymentdb
spring.datasource.username=payment
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# NOTE: example secret for local/dev only. In production use env vars/secret manager.
jwt.secret=0123456789abcdef0123456789abcdef
jwt.expiration=86400000

# Kafka (Docker Compose)
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Logging
logging.level.com.ridesharing=DEBUG