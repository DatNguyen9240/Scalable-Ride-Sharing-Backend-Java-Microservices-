server:
  port: 8080

jwt:
  secret: 0123456789abcdef0123456789abcdef
  expiration: 86400000

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
        - id: trip-service
          uri: http://trip-service:8082
          predicates:
            - Path=/api/trips/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1